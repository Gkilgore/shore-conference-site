// A small in-memory table so the Social media tab can add, change and remove links.
let socialRows = [{id:'social-1', school_id:'marlboro', platform:'instagram', url:'https://www.instagram.com/instagram/'}];
function socialTable() {
  let action = 'select', values = null; const filters = {};
  const query = {
    select() { return query; }, insert(row) { action = 'insert'; values = row; return query; },
    update(row) { action = 'update'; values = row; return query; }, delete() { action = 'delete'; return query; },
    eq(name, value) { filters[name] = value; return query; },
    then(callback) {
      const match = row => Object.entries(filters).every(([name, value]) => row[name] === value);
      if (action === 'insert') socialRows.push({id: 'social-' + Math.random(), ...values});
      if (action === 'update') socialRows = socialRows.map(row => match(row) ? {...row, ...values} : row);
      if (action === 'delete') socialRows = socialRows.filter(row => !match(row));
      return Promise.resolve({data: action === 'select' ? socialRows.filter(match) : null}).then(callback);
    },
  };
  return query;
}

  storage: {from: () => ({upload: async () => ({}), remove: async () => ({})})},
  functions: {invoke: async (name, options) => { transportationEmails.push({name,options}); return {data:{sent:true}}; }},
  from(table) {
    if (table === 'school_social_accounts') return socialTable();
    const result = {data: table === 'schools' ? schools : table === 'conference_documents' ? documents

    const query = {then: callback => Promise.resolve(result).then(callback)};
    for (const name of ['select','order','eq','maybeSingle','insert','delete']) query[name] = () => query;
    return query;
  },
  async rpc(name, args) {
    if (name === 'list_staff_access') return {data:{actor_role:'site_admin',accounts}};
    if (name === 'save_staff_game') {
      saveCalls.push(args.input);
      Object.assign(sampleGame, {
        ...args.input,
        revision:sampleGame.revision+1,
        teams:{sport:args.input.sport,gender:args.input.gender,level:args.input.level,season:args.input.season},

          early_dismissal_time:args.input.early_dismissal_time,return_time:args.input.return_time,notes:args.input.transport_notes,
        },
      });
      return {data:sampleGame.id};
    }
    return {data:[]};
  },
};
